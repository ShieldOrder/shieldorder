# ShieldOrder Rithmic Trading Configuration
# FDXM (Mini DAX) -> FDAX (DAX) + FESX (Euro Stoxx 50) Strategy

[rithmic]
# Fill these with your conformance-tested credentials
server_name = Rithmic Paper Trading
gateway = rituz01.rithmic.com
port = 443
user = YOUR_USER
password = YOUR_PASSWORD
system_name = YOUR_SYSTEM_NAME
app_name = ShieldOrder
app_version = 1.0.0
cert_file = ./rithmic_api/certs/rithmic_ssl_cert.pem
domain_server_address = rituz01.rithmic.com:443
license_key = YOUR_LICENSE_KEY

[strategy]
# Instruments (Eurex)
mini_dax_symbol = FDXM
dax_symbol = FDAX
eurostoxx_symbol = FESX
exchange = EUREX

# Signal generation
lookback_bars = 20
momentum_threshold = 0.3
correlation_threshold = 0.85
tick_aggregation_ms = 500

# Scaling: FDXM -> FDAX
initial_mini_lots = 2
scale_threshold = 0.6
max_fdax_lots = 2
max_fdxm_lots = 10
max_fesx_lots = 5

# Risk management
max_daily_loss_eur = 2000.0
max_position_loss_eur = 500.0
trailing_stop_points = 15.0
profit_target_points = 30.0
max_open_orders = 6
max_spread_ticks = 3.0

# Trading hours (UTC)
start_hour_utc = 7
end_hour_utc = 20
flatten_hour_utc = 21
